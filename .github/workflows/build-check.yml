name: BUILD CHECK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Commit generated lockfile on quality branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'quality/astro7-upgrade'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already committed."
          else
            git commit -m "Lock npm dependencies"
            git push origin HEAD:quality/astro7-upgrade
          fi
      - run: npm audit --audit-level=high
      - run: npm run validate:cameras
      - run: npm run build
      - name: Verify generated routes
        run: |
          test -f dist/index.html
          test -f dist/explore/index.html
          test -f dist/explore/hokkaido/index.html
          test -f dist/explore/hokkaido/sapporo/index.html
          test -f dist/favorites/index.html
          test -f dist/multiview/index.html
          node scripts/check-generated-routes.mjs
