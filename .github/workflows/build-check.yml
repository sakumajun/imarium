name: BUILD CHECK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:cameras
      - run: npm run build
      - name: Verify generated routes
        run: |
          test -f dist/index.html
          test -f dist/explore/index.html
          test -f dist/explore/hokkaido/index.html
          test -f dist/explore/hokkaido/sapporo/index.html
          test -f dist/favorites/index.html
          test -f dist/multiview/index.html
          test -f dist/sitemap.xml
          grep -q "https://imarium.live/" dist/sitemap.xml
          node scripts/check-generated-routes.mjs
