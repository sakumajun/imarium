name: BUILD CHECK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:cameras
      - run: npm run build
      - name: Verify generated routes
        run: |
          test -f dist/index.html
          test -f dist/explore/index.html
          test -f dist/explore/hokkaido/index.html
          test -f dist/favorites/index.html
          test -f dist/multiview/index.html
          node scripts/check-generated-routes.mjs
