name: BUILD CHECK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
      - run: npm audit --audit-level=high
      - run: npm run validate:cameras
      - run: npm run build
      - name: Verify generated routes
        run: |
          test -f dist/index.html
          test -f dist/explore/index.html
          test -f dist/explore/hokkaido/index.html
          test -f dist/explore/hokkaido/sapporo/index.html
          test -f dist/favorites/index.html
          test -f dist/multiview/index.html
          node scripts/check-generated-routes.mjs
