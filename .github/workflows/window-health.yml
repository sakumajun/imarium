name: WINDOW HEALTH

on:
  schedule:
    - cron: '0 21 * * *' # 06:00 JST
    - cron: '0 9 * * *'  # 18:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:cameras
      - run: npm run health:cameras
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Persist health state
        run: |
          if git diff --quiet -- src/data/cameras.json; then
            echo "No camera health changes."
            exit 0
          fi
          git config user.name "imarium-window-health[bot]"
          git config user.email "imarium-window-health[bot]@users.noreply.github.com"
          git add src/data/cameras.json
          git commit -m "Update WINDOW HEALTH state"
          git push
