name: WINDOW HEALTH

on:
  schedule:
    - cron: '0 21 * * *' # 06:00 JST
    - cron: '0 9 * * *'  # 18:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate camera data before health check
        run: npm run validate:cameras
      - name: Run WINDOW HEALTH
        run: npm run health:cameras
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Validate updated camera data
        run: npm run validate:cameras
      - name: Build site with updated WINDOW state
        run: npm run build
      - name: Verify generated routes
        run: |
          test -f dist/index.html
          test -f dist/explore/index.html
          test -f dist/explore/hokkaido/index.html
          test -f dist/favorites/index.html
          test -f dist/multiview/index.html
          node scripts/check-generated-routes.mjs
      - name: Persist health state only after validation
        run: |
          if git diff --quiet -- src/data/cameras.json src/data/camera-history.json; then
            echo "No WINDOW HEALTH changes."
            exit 0
          fi
          git config user.name "imarium-window-health[bot]"
          git config user.email "imarium-window-health[bot]@users.noreply.github.com"
          git add src/data/cameras.json src/data/camera-history.json
          git commit -m "Update WINDOW HEALTH state"
          git push
